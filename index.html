</style></head><body><canvas id="game"></canvas><div id="hud"><div class="top"><span id="pos">P1 / 6</span><span id="lap">LAP 1 / 3</span><span id="time">00:00.000</span></div><div class="speed"><b id="speed">000</b><small>KM/H</small></div><div class="track"><i id="dot"></i></div></div><div id="intro"><p class="eyebrow">AEIOUV MOTORWORKS · 001</p><h1>APEX<br><em>TIDE</em></h1><p class="lede">Azure Circuit. Three laps.<br>Built for thumbs, not a flagship GPU.</p><div class="mode"><button data-mode="race">RACE</button><button data-mode="tt">TIME TRIAL</button></div><p class="hint">Steer with ◀ ▶ · Hold throttle · Brake to rotate</p></div><div id="result"><p class="eyebrow">CHEQUERED FLAG</p><h2 id="finish">P1</h2><p id="summary"></p><button id="again">RUN IT AGAIN</button></div><div id="controls"><button id="left" aria-label="Steer left">◀</button><button id="right" aria-label="Steer right">▶</button><button id="brake">BRAKE</button><button id="gas">THROTTLE</button></div><div id="landscape">ROTATE FOR THE FULL CIRCUIT</div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.min.js"},"integrity":{"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.min.js":"sha384-G204cH8yiGRBsIeOd0ayBXn7MSDuf0X5To614xt+2b1ApqNUxAWn/XqL8Xilauyd"}}</script><script type="module">import * as THREE from 'three';

const ocean=new THREE.Mesh(new THREE.PlaneGeometry(1000,1000,28,28),new THREE.MeshStandardMaterial({color:0x286e83,roughness:.28,metalness:.18}));ocean.rotation.x=-Math.PI/2;ocean.position.y=-2.4;scene.add(ocean);

// fast-reading road furniture and motion marks
for(let i=0;i<N;i+=10){let p=trackPts[i],t=tans[i],n=new THREE.Vector3(-t.z,0,t.x);let dash=new THREE.Mesh(new THREE.BoxGeometry(.22,.035,3.2),new THREE.MeshBasicMaterial({color:0xe9dec2}));dash.position.copy(p);dash.position.y+=.36;dash.rotation.y=Math.atan2(t.x,t.z);scene.add(dash);for(let side of [-1,1]){let rail=new THREE.Mesh(new THREE.BoxGeometry(.18,.28,5.5),steel);rail.position.copy(p).addScaledVector(n,side*12.1);rail.position.y+=1.05;rail.rotation.y=Math.atan2(t.x,t.z);rail.castShadow=true;scene.add(rail)}}
for(let i=12;i<N;i+=42){let p=trackPts[i],t=tans[i],n=new THREE.Vector3(-t.z,0,t.x);let banner=new THREE.Group();let sign=new THREE.Mesh(new THREE.BoxGeometry(5.8,1.35,.18),new THREE.MeshStandardMaterial({color:i%84?0xdb522f:0xf1dfb5,roughness:.75}));sign.position.y=2.4;banner.add(sign);for(let x of [-2.5,2.5]){let pole=new THREE.Mesh(new THREE.BoxGeometry(.16,2.8,.16),steel);pole.position.set(x,1.2,0);banner.add(pole)}banner.position.copy(p).addScaledVector(n,(i%84?1:-1)*14.5);banner.rotation.y=Math.atan2(t.x,t.z);scene.add(banner)}

for(let i=55;i<135;i+=10){let p=trackPts[i],t=tans[i],n=new THREE.Vector3(-t.z,0,t.x);let ch=new THREE.Mesh(new THREE.BoxGeometry(2.8,1.3,.15),new THREE.MeshBasicMaterial({color:i%20?0xf0dfb4:0xdb522f}));ch.position.copy(p).addScaledVector(n,13);ch.position.y+=1.5;ch.rotation.y=Math.atan2(t.x,t.z);scene.add(ch)}
// scenery rocks, palms and tunnel
function rand(seed){return Math.abs(Math.sin(seed*931.17)*43758.5)%1}for(let i=0;i<58;i++){let a=i/58*Math.PI*2,r=113+rand(i)*22,x=Math.cos(a)*r,z=Math.sin(a)*r;let rock=new THREE.Mesh(new THREE.DodecahedronGeometry(2+rand(i+4)*5,0),new THREE.MeshStandardMaterial({color:i%3?0x706e54:0x9c805a,roughness:1}));rock.position.set(x,-.5,z);rock.scale.y=.55;rock.rotation.set(rand(i)*2,rand(i+1)*3,0);rock.castShadow=true;scene.add(rock)}
function palm(x,z,s=1){let g=new THREE.Group(),tr=new THREE.Mesh(new THREE.CylinderGeometry(.22,.36,5,6),new THREE.MeshStandardMaterial({color:0x725134}));tr.position.y=2.5;g.add(tr);for(let i=0;i<6;i++){let l=new THREE.Mesh(new THREE.ConeGeometry(.7,4,4),new THREE.MeshStandardMaterial({color:0x315f46,side:THREE.DoubleSide}));l.position.y=5;l.rotation.z=Math.PI/2;l.rotation.y=i*Math.PI/3;g.add(l)}g.position.set(x,0,z);g.scale.setScalar(s);scene.add(g)}for(let i=0;i<20;i++){let a=i/20*Math.PI*2,r=112+rand(i+9)*16;palm(Math.cos(a)*r,Math.sin(a)*r,.7+rand(i)*.5)}

function car(color){let g=new THREE.Group(),body=new THREE.Mesh(new THREE.BoxGeometry(3.5,.8,6.4),new THREE.MeshStandardMaterial({color,metalness:.35,roughness:.3}));body.position.y=1;body.castShadow=true;g.add(body);let cabin=new THREE.Mesh(new THREE.BoxGeometry(2.8,.75,2.5),new THREE.MeshStandardMaterial({color:0x16252b,metalness:.5,roughness:.15}));cabin.position.set(0,1.65,.2);g.add(cabin);for(let x of [-1.65,1.65])for(let z of [-2.1,2.1]){let w=new THREE.Mesh(new THREE.CylinderGeometry(.62,.62,.45,12),new THREE.MeshStandardMaterial({color:0x090909,roughness:.72}));w.rotation.z=Math.PI/2;w.position.set(x,.65,z);g.add(w)}let spoiler=new THREE.Mesh(new THREE.BoxGeometry(3.7,.16,.65),new THREE.MeshStandardMaterial({color:0x171b1d,metalness:.5,roughness:.35}));spoiler.position.set(0,1.55,2.65);g.add(spoiler);for(let x of [-1.15,1.15]){let tail=new THREE.Mesh(new THREE.BoxGeometry(.7,.22,.08),new THREE.MeshBasicMaterial({color:0xff281e}));tail.position.set(x,1.08,3.23);g.add(tail)}let shadow=new THREE.Mesh(new THREE.CircleGeometry(2.5,16),new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.28,depthWrite:false}));shadow.rotation.x=-Math.PI/2;shadow.scale.set(1,2.2,1);shadow.position.y=.18;g.add(shadow);return g}

let prev=performance.now(),fpsT=0;function loop(now){requestAnimationFrame(loop);let dt=Math.min((now-prev)/1000,.033);prev=now;lh.children.at(-1).rotation.x=now*.00035;if(running){let throttle=keys.gas||keys.ArrowUp||innerWidth>800?1:0,brake=keys.brake||keys.ArrowDown;steer=(keys.right||keys.ArrowRight?1:0)-(keys.left||keys.ArrowLeft?1:0);let target=brake?8:throttle?58:26;speed+= (target-speed)*dt*(brake?3.2:1.2);let grip=Math.max(.45,1-speed/105);lateral+=steer*dt*(7+speed*.07);lateral*=1-dt*(1.3+grip*1.7);lateral=THREE.MathUtils.clamp(lateral,-7.8,7.8);let old=t;t=(t+speed*dt/720)%1;if(t<old){lap++;if(lap>3){running=false;let ms=now-start;document.body.classList.remove('playing');document.querySelector('#result').style.display='flex';document.querySelector('#finish').textContent='P'+position();document.querySelector('#summary').textContent=`TOTAL ${fmt(ms)} · BEST ${fmt(ms/3)}`}}let p=curve.getPointAt(t),tan=curve.getTangentAt(t).normalize(),n=new THREE.Vector3(-tan.z,0,tan.x);player.position.copy(p).addScaledVector(n,lateral);player.rotation.y=Math.atan2(tan.x,tan.z)-lateral*.012;player.rotation.z=-steer*.055;ai.forEach((a,i)=>{a.t=(a.t+a.speed*dt)%1;let p=curve.getPointAt(a.t),ta=curve.getTangentAt(a.t).normalize(),nn=new THREE.Vector3(-ta.z,0,ta.x);a.m.position.copy(p).addScaledVector(nn,a.lane+Math.sin(now*.001+i)*.35);a.m.rotation.y=Math.atan2(ta.x,ta.z)});let back=tan.clone().multiplyScalar(-6.7-speed*.055).add(n.clone().multiplyScalar(-lateral*.13));let cp=player.position.clone().add(back);cp.y+=3.1+speed*.012;camera.position.lerp(cp,1-Math.pow(.003,dt));let look=player.position.clone().add(tan.clone().multiplyScalar(12));look.y+=1.2;camera.lookAt(look);camera.fov=60+speed*.27;camera.updateProjectionMatrix();document.querySelector('#speed').textContent=String(Math.round(speed*3.35)).padStart(3,'0');document.querySelector('#lap').textContent=`LAP ${Math.min(lap,3)} / 3`;document.querySelector('#pos').textContent=`P${position()} / ${trial?1:6}`;document.querySelector('#time').textContent=fmt(now-start);let ang=t*Math.PI*2;document.querySelector('#dot').style.transform=`translate(${Math.cos(ang)*40+40}px,${Math.sin(ang)*15+15}px)`}else{camera.position.set(0,38,150);camera.lookAt(0,0,0)}ocean.material.color.offsetHSL(0,0,Math.sin(now*.001)*.0002);renderer.render(scene,camera)}
